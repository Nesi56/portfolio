<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 650" role="img" aria-labelledby="title desc">
  <title id="title">Natsuki fan illustration</title>
  <desc id="desc">A fan-made vector illustration of Natsuki with pink twin tails and a school uniform.</desc>
  <defs>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3b5cb"/>
      <stop offset="1" stop-color="#d889aa"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0e6"/>
      <stop offset="1" stop-color="#f0cdbf"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9f9f4"/>
      <stop offset="1" stop-color="#dedfd9"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="7" stdDeviation="0" flood-color="#735d73" flood-opacity=".18"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)" stroke="#5b4c61" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- rear twin tails -->
    <path fill="url(#hair)" d="M149 206c-56 14-86 61-76 120 8 45 38 64 61 55-15-20-12-45 1-64-2 35 13 55 35 61 25-36 24-103-21-172z"/>
    <path fill="url(#hair)" d="M371 206c56 14 86 61 76 120-8 45-38 64-61 55 15-20 12-45-1-64 2 35-13 55-35 61-25-36-24-103 21-172z"/>

    <!-- hair ribbons -->
    <path fill="#da6f8e" d="M143 211l-59-34 17 57-33 26 68 6z"/>
    <path fill="#da6f8e" d="M377 211l59-34-17 57 33 26-68 6z"/>

    <!-- neck -->
    <path fill="url(#skin)" d="M225 357v54h70v-54z"/>

    <!-- torso shirt -->
    <path fill="url(#shirt)" d="M184 400c-54 28-72 90-73 181h298c-1-91-19-153-73-181l-41-15h-70z"/>
    <path fill="#6d6580" d="M183 404l-33 24 20 29 31-20-7 144h132l-7-144 31 20 20-29-33-24-42-18-35 29-35-29z"/>
    <path fill="#f7f7f1" d="M225 386l35 29 35-29 15 9-20 55h-60l-20-55z"/>

    <!-- red neck ribbon -->
    <path fill="#c95f72" d="M260 418l-27-19-15 18 24 22-17 59 35-20 35 20-17-59 24-22-15-18z"/>

    <!-- sleeves and arms -->
    <path fill="url(#shirt)" d="M184 403c-51 26-79 80-86 147l48 5 38-99z"/>
    <path fill="url(#shirt)" d="M336 403c51 26 79 80 86 147l-48 5-38-99z"/>
    <path fill="url(#skin)" d="M99 542c-7 34-4 65 12 79 13 11 31 4 39-10l12-61z"/>
    <path fill="url(#skin)" d="M421 542c7 34 4 65-12 79-13 11-31 4-39-10l-12-61z"/>

    <!-- head -->
    <path fill="url(#skin)" d="M169 184c0-94 53-145 91-145s91 51 91 145c0 91-42 181-91 181s-91-90-91-181z"/>

    <!-- hair cap -->
    <path fill="url(#hair)" d="M166 190c-16-105 38-166 94-166s110 61 94 166l-31-72c2 45-22 74-52 91 10-31 3-58-10-85-15 41-45 69-84 82l18-57z"/>
    <path fill="url(#hair)" d="M170 165c-30 44-30 112-3 160l25-55-6 72c20-7 34-21 43-40l-15-107z"/>
    <path fill="url(#hair)" d="M350 165c30 44 30 112 3 160l-25-55 6 72c-20-7-34-21-43-40l15-107z"/>

    <!-- bangs -->
    <path fill="url(#hair)" d="M178 146c13-69 41-102 82-107-20 29-16 65 3 101-22-16-42-23-64-22 21 18 25 40 24 68z"/>
    <path fill="url(#hair)" d="M342 146c-13-69-41-102-82-107 20 29 16 65-3 101 22-16 42-23 64-22-21 18-25 40-24 68z"/>

    <!-- eyes -->
    <path fill="#fff" d="M194 221c14-21 41-22 57 1-17 19-42 19-57-1z"/>
    <ellipse fill="#cf739b" cx="224" cy="222" rx="12" ry="16"/>
    <ellipse fill="#51435e" cx="224" cy="224" rx="5" ry="9" stroke="none"/>
    <circle fill="#fff" cx="228" cy="218" r="3" stroke="none"/>
    <path fill="#fff" d="M269 222c16-23 43-22 57-1-15 20-40 20-57 1z"/>
    <ellipse fill="#cf739b" cx="296" cy="222" rx="12" ry="16"/>
    <ellipse fill="#51435e" cx="296" cy="224" rx="5" ry="9" stroke="none"/>
    <circle fill="#fff" cx="300" cy="218" r="3" stroke="none"/>
    <path fill="none" d="M191 203c18-14 41-13 58 1M271 204c17-14 40-15 58-1"/>

    <!-- face -->
    <path fill="none" d="M260 231l-5 29 10 3"/>
    <path fill="#bd5c75" d="M234 286c16 11 36 11 52 0-5 24-45 26-52 0z"/>
    <path fill="#df8ea2" stroke="none" opacity=".35" d="M186 267c19-11 39-8 49 3-13 12-38 13-49-3zM334 267c-19-11-39-8-49 3 13 12 38 13 49-3z"/>

    <!-- hair clips -->
    <path fill="#e85f82" d="M191 153l-25 18 9 11 25-19z"/>
    <path fill="#e85f82" d="M202 166l-24 20 9 10 25-20z"/>
  </g>

  <!-- tiny cupcake motif -->
  <g transform="translate(388 92) rotate(8)" stroke="#6a576d" stroke-width="3" stroke-linejoin="round">
    <path fill="#e4b574" d="M0 35h52l-7 39H7z"/>
    <path fill="#f0bdd0" d="M3 37c-8-20 7-29 18-23 5-17 29-13 28 6 13 1 18 19 3 23z"/>
    <circle fill="#d95e79" cx="27" cy="8" r="7"/>
  </g>
</svg>
